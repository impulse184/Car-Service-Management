<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="750" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Box Gradients -->
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="eurekaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="opsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="valGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="auditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Title Banner -->
  <text x="600" y="45" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">Car Operations Management — Microservices Architecture</text>
  <text x="600" y="70" font-size="13" fill="#94a3b8" text-anchor="middle">Spring Boot 3.3.1 | Spring Cloud | OpenFeign | Apache Kafka | JWT Security | Actuator Monitoring</text>

  <!-- Client / Browser Box -->
  <g transform="translate(40, 120)" filter="url(#dropShadow)">
    <rect width="180" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="30" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">🖥️ Web Frontend</text>
    <text x="90" y="52" font-size="11" fill="#94a3b8" text-anchor="middle">HTML5 / Vanilla CSS3 / JS</text>
    <text x="90" y="70" font-size="11" fill="#94a3b8" text-anchor="middle">Glassmorphic Dashboard</text>
    <text x="90" y="88" font-size="11" fill="#cbd5e1" text-anchor="middle">Actuator Health Monitor</text>
  </g>

  <!-- API Gateway Box -->
  <g transform="translate(290, 120)" filter="url(#dropShadow)">
    <rect width="210" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect width="210" height="32" rx="10" fill="url(#gatewayGrad)"/>
    <text x="105" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ API Gateway (:8765)</text>
    <text x="15" y="55" font-size="11" fill="#cbd5e1">• JwtAuthenticationFilter</text>
    <text x="15" y="73" font-size="11" fill="#cbd5e1">• RBAC Authorization (Roles)</text>
    <text x="15" y="91" font-size="11" fill="#cbd5e1">• Header Injection (X-Auth-*)</text>
    <text x="15" y="109" font-size="11" fill="#cbd5e1">• Global CORS Filter</text>
    <text x="15" y="127" font-size="11" fill="#cbd5e1">• Swagger UI Aggregator</text>
  </g>

  <!-- Eureka Discovery Server Box -->
  <g transform="translate(290, 330)" filter="url(#dropShadow)">
    <rect width="210" height="110" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect width="210" height="30" rx="10" fill="url(#eurekaGrad)"/>
    <text x="105" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🔍 Eureka Server (:8761)</text>
    <text x="105" y="52" font-size="11" fill="#cbd5e1" text-anchor="middle">Service Registry &amp; Discovery</text>
    <text x="105" y="70" font-size="11" fill="#94a3b8" text-anchor="middle">Dynamic Load Balancing</text>
    <text x="105" y="88" font-size="11" fill="#94a3b8" text-anchor="middle">Instance Heartbeats</text>
  </g>

  <!-- User Profile Service Box -->
  <g transform="translate(580, 120)" filter="url(#dropShadow)">
    <rect width="240" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="32" rx="10" fill="url(#userGrad)"/>
    <text x="120" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">👤 User Profile Service (:8081)</text>
    <text x="15" y="55" font-size="11" fill="#cbd5e1">• User, Admin, Mechanic Profiles</text>
    <text x="15" y="73" font-size="11" fill="#cbd5e1">• Password Hashing (Salt + Pepper)</text>
    <text x="15" y="91" font-size="11" fill="#cbd5e1">• ServiceSecurityFilter (JWT)</text>
    <text x="15" y="109" font-size="11" fill="#cbd5e1">• Auto-Seeder (admin/adminpassword)</text>
    <rect x="15" y="120" width="210" height="20" rx="4" fill="#064e3b"/>
    <text x="120" y="134" font-size="10" fill="#6ee7b7" text-anchor="middle">🗄️ MySQL: carservice_user_db</text>
  </g>

  <!-- Car Service Operations Box -->
  <g transform="translate(580, 310)" filter="url(#dropShadow)">
    <rect width="240" height="170" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="240" height="32" rx="10" fill="url(#opsGrad)"/>
    <text x="120" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🚗 Service Operations (:8082)</text>
    <text x="15" y="55" font-size="11" fill="#cbd5e1">• Booking &amp; Fleet Workflows</text>
    <text x="15" y="73" font-size="11" fill="#cbd5e1">• OpenFeign Client (User Check)</text>
    <text x="15" y="91" font-size="11" fill="#cbd5e1">• OpenFeign Client (Plate Check)</text>
    <text x="15" y="109" font-size="11" fill="#cbd5e1">• ServiceSecurityFilter (JWT)</text>
    <text x="15" y="127" font-size="11" fill="#cbd5e1">• Kafka Event Publisher</text>
    <rect x="15" y="140" width="210" height="20" rx="4" fill="#4c1d95"/>
    <text x="120" y="154" font-size="10" fill="#c4b5fd" text-anchor="middle">🗄️ MySQL: carservice_ops_db</text>
  </g>

  <!-- Car Details Validation Box -->
  <g transform="translate(580, 520)" filter="url(#dropShadow)">
    <rect width="240" height="110" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="240" height="30" rx="10" fill="url(#valGrad)"/>
    <text x="120" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ Validation Service (:8083)</text>
    <text x="15" y="52" font-size="11" fill="#cbd5e1">• National License Plate Regex</text>
    <text x="15" y="70" font-size="11" fill="#cbd5e1">• Format Cleanse &amp; Uppercase</text>
    <text x="15" y="88" font-size="11" fill="#cbd5e1">• ServiceSecurityFilter (JWT)</text>
  </g>

  <!-- Apache Kafka Box -->
  <g transform="translate(890, 310)" filter="url(#dropShadow)">
    <rect width="260" height="110" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect width="260" height="30" rx="10" fill="url(#kafkaGrad)"/>
    <text x="130" y="20" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">📨 Apache Kafka Broker (:9092)</text>
    <text x="130" y="52" font-size="11" fill="#cbd5e1" text-anchor="middle">Topic: car-service-audit-events</text>
    <text x="130" y="70" font-size="11" fill="#94a3b8" text-anchor="middle">ZooKeeper Coordination (:2181)</text>
    <text x="130" y="88" font-size="11" fill="#94a3b8" text-anchor="middle">Asynchronous Event Buffer</text>
  </g>

  <!-- Audit Logging Service Box -->
  <g transform="translate(890, 480)" filter="url(#dropShadow)">
    <rect width="260" height="150" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <rect width="260" height="32" rx="10" fill="url(#auditGrad)"/>
    <text x="130" y="22" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">📝 Audit Logging Service (:8084)</text>
    <text x="15" y="55" font-size="11" fill="#cbd5e1">• Kafka Event Consumer (audit-group)</text>
    <text x="15" y="73" font-size="11" fill="#cbd5e1">• Audit Trail Persistence</text>
    <text x="15" y="91" font-size="11" fill="#cbd5e1">• ServiceSecurityFilter (JWT)</text>
    <text x="15" y="109" font-size="11" fill="#cbd5e1">• Actuator Component Metrics</text>
    <rect x="15" y="120" width="230" height="20" rx="4" fill="#831843"/>
    <text x="130" y="134" font-size="10" fill="#fbcfe8" text-anchor="middle">🗄️ MySQL: carservice_audit_db</text>
  </g>

  <!-- Actuator Monitoring Bar at Bottom -->
  <g transform="translate(40, 660)" filter="url(#dropShadow)">
    <rect width="1110" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="555" y="26" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">📊 Spring Boot Actuator Dashboard &amp; Dual-Layer Security Model</text>
    <text x="555" y="46" font-size="11" fill="#cbd5e1" text-anchor="middle">Real-time /actuator/health checks across all 6 ports (8765, 8081, 8082, 8083, 8084, 8761) | Direct unauthenticated API calls blocked with 401 Unauthorized</text>
  </g>

  <!-- Connectors / Lines -->
  <!-- Frontend to Gateway -->
  <line x1="220" y1="175" x2="284" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Gateway to Eureka -->
  <line x1="395" y1="270" x2="395" y2="324" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Gateway to User Profile -->
  <line x1="500" y1="150" x2="574" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Gateway to Operations -->
  <path d="M 500 200 L 540 200 L 540 370 L 574 370" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- OpenFeign: Operations to User Profile -->
  <path d="M 700 310 L 700 276" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="280" width="100" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="700" y="293" font-size="9" fill="#f59e0b" text-anchor="middle">OpenFeign Client</text>

  <!-- OpenFeign: Operations to Validation -->
  <path d="M 700 480 L 700 514" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Operations to Kafka -->
  <line x1="820" y1="365" x2="884" y2="365" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowGreen)"/>
  <text x="852" y="358" font-size="9" fill="#a7f3d0" text-anchor="middle">Kafka Producer</text>

  <!-- Kafka to Audit Service -->
  <line x1="1020" y1="420" x2="1020" y2="474" stroke="#f472b6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="1070" y="450" font-size="9" fill="#f472b6" text-anchor="middle">Kafka Consumer</text>
</svg>
