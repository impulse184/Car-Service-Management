# Service Configuration
server.port=8084
server.servlet.context-path=/audits
spring.application.name=audit-service

# Database Configuration (Separate DB for Auditing)
spring.datasource.url=jdbc:mysql://localhost:3306/carservice_audit_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# 1. Trust all source packages
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# 2. Tell the deserializer to map incoming JSON directly to a plain Map object
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map
# 3. Force it to ignore the __TypeId__ header sent by the operations service
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

